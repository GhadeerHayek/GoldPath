[project]
name = "goldpath"
version = "0.1.0"
description = "Demo application proving the GoldPath agentic delivery pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv]
# `app/` is run directly, never installed as a distribution, so uv treats this
# as a virtual project: it resolves and installs the dependencies but does not
# build the project itself. Without this, `uv sync` demands a build backend.
package = false

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
