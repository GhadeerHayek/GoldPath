version: 2

updates:
  # Python dependencies. `uv` is a distinct ecosystem from `pip` and updates
  # uv.lock directly, so Dependabot's PRs stay consistent with `uv sync
  # --locked` in CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # A compromised package is usually yanked within days of publication.
    # Waiting before adopting a brand-new release costs nothing and takes us
    # out of the blast radius of the fastest-moving supply-chain attacks.
    cooldown:
      default-days: 3
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow actions are pinned to commit SHAs. Dependabot understands those
  # pins and updates the SHA together with its version comment — which is what
  # makes SHA pinning maintainable rather than a thing that rots.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  # The python:3.12-slim base image, where most CVEs in a Python container
  # actually live.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
