name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Scanner versions are pinned so a scan cannot start failing (or, worse, stop
# failing) because an upstream release changed underneath us. Bumping these is
# a reviewed commit like any other.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.172.0"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  # Secrets that reach a public repository are compromised the moment they land
  # — rotation is the only remedy. This is the gate that stops it.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commit history, not just the working tree. A shallow
          # clone would miss a key committed three commits ago and deleted in
          # the next one — which is still fully readable in the object store.
          fetch-depth: 0

      # Deliberately the gitleaks binary rather than gitleaks/gitleaks-action:
      # the action requires a GITLEAKS_LICENSE secret for organization-owned
      # repositories. This workflow has to be reusable on the MindVault repos,
      # where we cannot add secrets, so a scanner that needs one is not
      # portable. The binary itself is MIT and needs no key.
      - name: Install gitleaks
        run: |
          curl --silent --show-error --fail --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # `--redact` keeps any matched secret out of the log. Workflow logs on a
      # public repository are public: an unredacted finding would leak the
      # credential to everyone while reporting that it leaked.
      - name: Scan history for secrets
        run: gitleaks git --redact --verbose .

  # Static analysis for insecure patterns the linter does not model:
  # injection sinks, unsafe deserialisation, hardcoded credentials.
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--metrics=off` stops semgrep reporting scan telemetry to its vendor.
      # Findings describe where our code is weak; that is not third-party data.
      - name: Semgrep
        run: |
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --config p/python \
            --config p/security-audit \
            --metrics=off \
            --error

  # Known CVEs in the dependency tree. Audits the resolved lockfile rather than
  # the installed environment, so the result matches what CI and the image
  # actually install.
  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export locked dependencies
        run: |
          uv export --no-dev --format requirements-txt \
            --no-emit-project --output-file requirements-audit.txt

      # `--require-hashes` verifies each package against the hash uv recorded,
      # so this checks integrity as well as CVEs. `--strict` fails the job when
      # a dependency cannot be audited, rather than passing on a silent skip.
      - name: pip-audit
        run: |
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit \
            --requirement requirements-audit.txt \
            --require-hashes \
            --strict
