name: Guardrails

# Tests the tests. Every job here asserts that a security scanner FAILS on
# known-bad input. A scanner that has only ever passed is unfalsified: it might
# be misconfigured, silently exiting 0, or scanning nothing at all, and a green
# check would look identical either way.
#
# The bad input is generated at runtime in a throwaway directory and never
# committed. Committing a fake secret as a fixture would mean the real
# `secrets` job finds it on every scan forever, forcing an allowlist entry —
# and that entry would then suppress genuine findings shaped like it.
#
# NOTE: the pass/fail logic in every job below is INVERTED. Scanner exits
# non-zero == guardrail passes. Read carefully before editing.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".gitleaks.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
  schedule:
    # Weekly, so drift in a scanner's default ruleset surfaces on its own
    # rather than the next time someone happens to edit a workflow.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Deliberately NOT in the ruleset's required status checks. This workflow is
# path-filtered, so on a PR that touches no workflow it never runs — and a
# required check that never reports leaves the PR pending forever.
permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.172.0"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  gitleaks-blocks:
    name: gitleaks blocks a secret
    runs-on: ubuntu-latest
    steps:
      - name: Install gitleaks
        run: |
          curl --silent --show-error --fail --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Assert gitleaks fails on a planted credential
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "${workdir}"
          git init --quiet

          # Draw one pool of randomness up front rather than piping /dev/urandom
          # into `head`. Under `set -o pipefail`, `head` closing the pipe early
          # kills `tr` with SIGPIPE and fails the whole script before the
          # scanner ever runs. Here every command in the pipeline consumes its
          # input to completion, so nothing gets a broken pipe.
          pool="$(head -c 512 /dev/urandom | base64 | LC_ALL=C tr -dc 'A-Za-z0-9')"

          # Generated, never committed to GoldPath. Deliberately NOT the AWS
          # documentation key (AKIAIOSFODNN7EXAMPLE) — gitleaks allowlists
          # that, so a test using it passes while proving nothing.
          aws_id="AKIA$(printf '%s' "${pool:0:16}" | LC_ALL=C tr 'a-z' 'A-Z')"
          aws_secret="${pool:16:40}"
          # A PAT-shaped token as well: gitleaks matches this by regex rather
          # than by entropy score, so the assertion does not depend on a random
          # string happening to clear an entropy threshold.
          gh_pat="ghp_${pool:56:36}"

          {
            printf 'AWS_ACCESS_KEY_ID = "%s"\n' "${aws_id}"
            printf 'AWS_SECRET_ACCESS_KEY = "%s"\n' "${aws_secret}"
            printf 'GITHUB_TOKEN = "%s"\n' "${gh_pat}"
          } > config.py

          git add -A
          git -c user.email=guardrail@example.com -c user.name=guardrail \
            commit --quiet --message "planted credential"

          if gitleaks git --redact "${workdir}" > gitleaks.log 2>&1; then
            echo "::error::GUARDRAIL FAILED — gitleaks exited 0 on a planted credential."
            echo "The 'secrets' job in security.yml is not actually blocking anything."
            cat gitleaks.log
            exit 1
          fi
          echo "gitleaks correctly exited non-zero on a planted credential."

  semgrep-blocks:
    name: semgrep blocks an injection sink
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Assert semgrep fails on a known-vulnerable pattern
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cat > "${workdir}/vulnerable.py" <<'PY'
          import subprocess


          def run_command(user_input):
              # Command injection: shell=True on caller-controlled input.
              subprocess.run(user_input, shell=True)


          def evaluate(user_input):
              # Arbitrary code execution.
              return eval(user_input)
          PY

          if uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
               --config p/python \
               --config p/security-audit \
               --metrics=off \
               --error \
               "${workdir}" > semgrep.log 2>&1; then
            echo "::error::GUARDRAIL FAILED — semgrep exited 0 on shell=True and eval()."
            echo "The 'sast' job in security.yml is not actually blocking anything."
            cat semgrep.log
            exit 1
          fi
          echo "semgrep correctly exited non-zero on an injection sink."

  pip-audit-blocks:
    name: pip-audit blocks a vulnerable dependency
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Assert pip-audit fails on a package with a known CVE
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          # requests 2.19.1 carries CVE-2018-18074 (credential leak on
          # redirect). Old and stable, so this assertion does not churn.
          echo "requests==2.19.1" > "${workdir}/requirements.txt"

          if uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit \
               --requirement "${workdir}/requirements.txt" \
               --no-deps > pip-audit.log 2>&1; then
            echo "::error::GUARDRAIL FAILED — pip-audit exited 0 on requests==2.19.1 (CVE-2018-18074)."
            echo "The 'deps' job in security.yml is not actually blocking anything."
            cat pip-audit.log
            exit 1
          fi
          echo "pip-audit correctly exited non-zero on a known-vulnerable package."
